<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amazon Finds | Mylin & Co.</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .amazon-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .amazon-page h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .amazon-subtitle {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .affiliate-disclosure {
      max-width: 700px;
      margin: 0 auto 40px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
    }

    .finds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .find-card {
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 25px;
      background: #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }

    .find-card h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .find-card p {
      line-height: 1.6;
    }

    .amazon-button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 25px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    .amazon-button:hover {
      opacity: .8;
    }

    .back-home {
      display: inline-block;
      margin-top: 50px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="amazon-page">

    <h1>Mylin & Co. Amazon Finds ✨</h1>

    <p class="amazon-subtitle">
      Event, photo booth & small-business finds we love.
    </p>

    <p style="font-size: 12px; margin-top: 40px; opacity: 0.7;">
      Amazon Affiliate
    </p>

    <div class="finds-grid">

      <div class="find-card">
        <h2>Wedding Photo Booth Props</h2>

        <p>
          A 40-piece set of pre-assembled wedding photo booth props
          for receptions, parties and celebrations.
        </p>

        <!-- WE WILL PUT YOUR AMAZON AFFILIATE LINK BELOW -->
        <a href="https://link.amazon/B0hQqykID"
           class="amazon-button"
           target="_blank"
           rel="nofollow sponsored">
          Shop on Amazon
        </a>
      </div>

    </div>

    <a href="index.html" class="back-home">
      ← Back to Mylin & Co.
    </a>

  </main>

</body>
</html>
